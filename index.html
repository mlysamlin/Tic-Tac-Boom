<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tick Tack Boom - The Bomb Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Screen shake on detonation */
    @keyframes violent-shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-18px, -20px) rotate(-4deg); }
      20% { transform: translate(20px, 16px) rotate(4deg); }
      30% { transform: translate(-20px, 14px) rotate(-3deg); }
      40% { transform: translate(18px, -18px) rotate(3deg); }
      50% { transform: translate(-14px, 14px) rotate(-2deg); }
      60% { transform: translate(14px, -12px) rotate(2deg); }
      70% { transform: translate(-10px, 10px) rotate(-1deg); }
      80% { transform: translate(8px, -8px) rotate(0.5deg); }
      90% { transform: translate(-4px, 4px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .shake-explosion {
      animation: violent-shake 0.85s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Spark flame flickering on fuse tip */
    @keyframes spark-flicker {
      0%, 100% {
        transform: scale(1) translate(0, 0) rotate(-6deg);
        filter: drop-shadow(0 0 8px #fde047) drop-shadow(0 0 16px #ea580c);
      }
      50% {
        transform: scale(1.35) translate(-2px, -2px) rotate(10deg);
        filter: drop-shadow(0 0 16px #facc15) drop-shadow(0 0 24px #dc2626);
      }
    }

    .sparkle {
      animation: spark-flicker 0.12s infinite alternate ease-in-out;
    }

    /* Tense bomb pulsing while lit */
    @keyframes tense-pulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.04) rotate(-1.5deg); }
      50% { transform: scale(1.02) rotate(0deg); }
      75% { transform: scale(1.05) rotate(1.5deg); }
    }

    .bomb-ticking {
      animation: tense-pulse 0.45s infinite ease-in-out;
    }

    /* Expanding blast wave rings */
    @keyframes blast-wave {
      0% { transform: scale(0.2); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .blast-wave-anim {
      animation: blast-wave 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* Logo styling - positioned at top of bomb container */
    #gameLogo {
      max-width: 120px;
      height: auto;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
      pointer-events: none;
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
    }

    @media (max-width: 640px) {
      #gameLogo {
        max-width: 90px;
        top: -30px;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body id="gameScreen" class="h-full m-0 p-0 font-sans antialiased overflow-hidden transition-colors duration-300 bg-[#22c55e] cursor-pointer flex flex-col items-center justify-center">

  <main id="contentContainer" class="w-full h-full flex flex-col items-center justify-center p-6 text-center text-white relative">
    
    <div class="max-w-md w-full flex flex-col items-center justify-center pointer-events-none space-y-6">
      
      <div id="bombVisualContainer" class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center">
        
        <img id="gameLogo" src="image-removebg-preview.png" alt="Tic Tac Boom" />
        
        <div id="shockwaveRing" class="hidden absolute w-48 h-48 rounded-full border-4 border-yellow-300 pointer-events-none"></div>
        <div id="shockwaveRing2" class="hidden absolute w-48 h-48 rounded-full border-4 border-orange-400 pointer-events-none delay-100"></div>

        <div id="bombActor" class="relative w-52 h-52 sm:w-60 sm:h-60 transition-transform duration-200">
          
          <div id="fuseFlame" class="hidden absolute top-2 right-8 text-3xl sm:text-4xl sparkle pointer-events-none z-20">
            💥
          </div>

          <svg class="w-full h-full drop-shadow-2xl overflow-visible" viewBox="0 0 200 200" fill="none">
            <path d="M106 62 C115 42, 132 35, 148 30 C156 28, 160 22, 164 16" 
                  stroke="#b45309" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M106 62 C115 42, 132 35, 148 30 C156 28, 160 22, 164 16" 
                  stroke="#fef08a" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 5" fill="none"/>

            <path d="M88 64 L114 62 L117 76 L85 78 Z" fill="#374151" stroke="#1f2937" stroke-width="3"/>
            <ellipse cx="101" cy="63" rx="14" ry="4" fill="#4b5563"/>

            <circle cx="100" cy="126" r="62" fill="#18181b" stroke="#09090b" stroke-width="5"/>

            <path d="M68 90 A 42 42 0 0 1 122 84" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.32" fill="none"/>
            <ellipse cx="78" cy="100" rx="14" ry="7" fill="#ffffff" opacity="0.35" transform="rotate(-35 78 100)"/>
            <circle cx="88" cy="93" r="3.5" fill="#ffffff" opacity="0.55"/>

            <ellipse cx="100" cy="172" rx="36" ry="10" fill="#000000" opacity="0.3"/>
          </svg>
        </div>

        <div id="explosionActor" class="hidden absolute inset-0 flex items-center justify-center scale-125 z-10">
          <svg class="w-64 h-64 sm:w-72 sm:h-72 drop-shadow-2xl overflow-visible" viewBox="0 0 200 200">
            <polygon points="100,10 125,60 185,35 155,85 200,110 150,135 180,185 125,160 100,200 75,160 20,185 50,135 0,110 45,85 15,35 75,60" fill="#facc15" stroke="#ea580c" stroke-width="6"/>
            <polygon points="100,30 118,68 160,52 138,88 170,110 132,126 150,165 115,145 100,175 82,145 50,165 65,126 30,110 62,88 40,52 82,68" fill="#f97316"/>
            <circle cx="100" cy="110" r="34" fill="#ffffff" filter="drop-shadow(0 0 16px #fde047)"/>
            <path d="M40 50 L30 35 L48 40 Z" fill="#27272a"/>
            <path d="M165 40 L180 25 L160 30 Z" fill="#27272a"/>
            <path d="M170 160 L190 175 L165 175 Z" fill="#27272a"/>
            <path d="M35 160 L20 180 L40 175 Z" fill="#27272a"/>
          </svg>
        </div>

      </div>

      <p id="instruction" class="text-lg sm:text-xl text-white/95 font-semibold max-w-sm drop-shadow">
        Tap anywhere to light the fuse!
      </p>

      <div id="statsBadge" class="hidden px-5 py-2.5 rounded-full bg-black/45 backdrop-blur-md text-sm sm:text-base font-bold tracking-wide border border-white/20 shadow-2xl">
        The fuse burned for <span id="heldDuration" class="text-amber-300">0.0</span>s before detonation!
      </div>
    </div>

    <footer class="absolute bottom-5 left-0 right-0 flex justify-center items-center gap-3 pointer-events-auto px-4">
      <button id="soundToggleBtn" class="text-xs uppercase font-medium tracking-wider text-white px-3.5 py-2 rounded-full bg-black/25 hover:bg-black/40 backdrop-blur-sm transition border border-white/10 flex items-center gap-2">
        <span id="soundStatusIcon">🔊</span> Sound On
      </button>

      <button id="qrBtn" class="text-xs uppercase font-medium tracking-wider text-white px-3.5 py-2 rounded-full bg-black/25 hover:bg-black/40 backdrop-blur-sm transition border border-white/10 flex items-center gap-2">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
        </svg>
        QR Code
      </button>
    </footer>

    <div id="qrModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-neutral-900 text-white rounded-2xl max-w-xs w-full p-6 shadow-2xl border border-white/10 text-center pointer-events-auto flex flex-col items-center" onclick="event.stopPropagation()">
        
        <div class="w-full flex items-center justify-between pb-2 mb-3 border-b border-white/10">
          <h2 class="text-base font-bold flex items-center gap-2">
            <span>📱</span> Scan to Play
          </h2>
          <button id="closeQrIconBtn" class="text-neutral-400 hover:text-white text-xl leading-none">&times;</button>
        </div>

        <div class="bg-white p-3.5 rounded-xl shadow-lg my-2 flex justify-center items-center">
          <div id="qrcodeDisplay"></div>
        </div>

        <p class="text-[11px] text-neutral-400 mt-2 mb-4">Scan with any phone camera to join the game</p>

        <button id="closeQrBtn" class="w-full py-2.5 rounded-lg bg-neutral-800 hover:bg-neutral-700 text-white font-medium text-xs transition">
          Close
        </button>
      </div>
    </div>

  </main>

  <script>
    let gameState = 'IDLE';
    let explosionTimeout = null;
    let tickInterval = null;
    let startTime = 0;
    let soundEnabled = true;

    const gameScreen = document.getElementById('gameScreen');
    const contentContainer = document.getElementById('contentContainer');
    const bombActor = document.getElementById('bombActor');
    const explosionActor = document.getElementById('explosionActor');
    const shockwaveRing = document.getElementById('shockwaveRing');
    const shockwaveRing2 = document.getElementById('shockwaveRing2');
    const fuseFlame = document.getElementById('fuseFlame');
    const gameLogo = document.getElementById('gameLogo');
    const instruction = document.getElementById('instruction');
    const statsBadge = document.getElementById('statsBadge');
    const heldDuration = document.getElementById('heldDuration');

    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundStatusIcon = document.getElementById('soundStatusIcon');
    const qrBtn = document.getElementById('qrBtn');
    const qrModal = document.getElementById('qrModal');
    const closeQrBtn = document.getElementById('closeQrBtn');
    const closeQrIconBtn = document.getElementById('closeQrIconBtn');
    const qrcodeDisplay = document.getElementById('qrcodeDisplay');

    let qrcodeInstance = null;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTickSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.035);

        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.035);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.04);
      } catch (e) {
        console.warn(e);
      }
    }

    function playExplosionSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();

        const subOsc = ctx.createOscillator();
        const subGain = ctx.createGain();
        subOsc.type = 'sawtooth';
        subOsc.frequency.setValueAtTime(180, ctx.currentTime);
        subOsc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 1.4);

        subGain.gain.setValueAtTime(1.0, ctx.currentTime);
        subGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);

        subOsc.connect(subGain);
        subGain.connect(ctx.destination);
        subOsc.start();
        subOsc.stop(ctx.currentTime + 1.4);

        const bufferSize = ctx.sampleRate * 1.5;
        const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = ctx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 1.5);

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(1.0, ctx.currentTime);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);

        whiteNoise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        whiteNoise.start();
        whiteNoise.stop(ctx.currentTime + 1.5);
      } catch (e) {
        console.warn(e);
      }
    }

    function resetToGreen() {
      gameState = 'IDLE';
      if (explosionTimeout) clearTimeout(explosionTimeout);
      if (tickInterval) clearInterval(tickInterval);

      gameScreen.className = "h-full m-0 p-0 font-sans antialiased overflow-hidden transition-colors duration-300 bg-[#22c55e] cursor-pointer flex flex-col items-center justify-center";
      contentContainer.classList.remove('shake-explosion');

      bombActor.classList.remove('hidden');
      bombActor.className = "relative w-52 h-52 sm:w-60 sm:h-60 transition-transform duration-200";
      fuseFlame.classList.add('hidden');
      explosionActor.classList.add('hidden');
      shockwaveRing.classList.add('hidden');
      shockwaveRing2.classList.add('hidden');

      gameLogo.style.display = 'block';
      instruction.innerHTML = "Tap anywhere to light the fuse!";
      statsBadge.classList.add('hidden');
    }

    function startBombTimer() {
      gameState = 'ACTIVE';
      startTime = performance.now();
      const chosenDurationMs = Math.floor(Math.random() * (30000 - 10000)) + 10000;

      gameScreen.className = "h-full m-0 p-0 font-sans antialiased overflow-hidden transition-colors duration-300 bg-[#16a34a] cursor-pointer flex flex-col items-center justify-center";
      bombActor.className = "relative w-52 h-52 sm:w-60 sm:h-60 bomb-ticking";
      fuseFlame.classList.remove('hidden');

      gameLogo.style.display = 'none';
      instruction.innerHTML = "Pass the bomb quickly!<br><span class='text-sm font-medium text-white/90 animate-pulse'>Detonation can occur at any second...</span>";
      statsBadge.classList.add('hidden');

      playTickSound();
      tickInterval = setInterval(() => {
        playTickSound();
      }, 650);

      explosionTimeout = setTimeout(() => {
        explodeBomb();
      }, chosenDurationMs);
    }

    function explodeBomb() {
      gameState = 'EXPLODED';
      if (tickInterval) clearInterval(tickInterval);

      const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);

      gameScreen.className = "h-full m-0 p-0 font-sans antialiased overflow-hidden transition-colors duration-75 bg-[#dc2626] cursor-pointer flex flex-col items-center justify-center";
      
      contentContainer.classList.remove('shake-explosion');
      void contentContainer.offsetWidth;
      contentContainer.classList.add('shake-explosion');

      bombActor.classList.add('hidden');
      explosionActor.classList.remove('hidden');
      fuseFlame.classList.add('hidden');

      shockwaveRing.classList.remove('hidden', 'blast-wave-anim');
      shockwaveRing2.classList.remove('hidden', 'blast-wave-anim');
      void shockwaveRing.offsetWidth;
      shockwaveRing.classList.add('blast-wave-anim');
      shockwaveRing2.classList.add('blast-wave-anim');

      gameLogo.style.display = 'none';
      instruction.innerHTML = "The bomb exploded in your hands!<br><span class='text-sm font-bold text-white/95'>Tap anywhere to play again.</span>";

      heldDuration.textContent = elapsed;
      statsBadge.classList.remove('hidden');

      playExplosionSound();
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([250, 100, 350]);
      }
    }

    gameScreen.addEventListener('click', (e) => {
      if (qrModal.contains(e.target) || qrBtn.contains(e.target) || soundToggleBtn.contains(e.target)) {
        return;
      }

      getAudioContext();

      if (gameState === 'IDLE') {
        startBombTimer();
      } else if (gameState === 'EXPLODED') {
        resetToGreen();
      }
    });

    soundToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundToggleBtn.innerHTML = `<span id="soundStatusIcon">${soundEnabled ? '🔊' : '🔇'}</span> Sound ${soundEnabled ? 'On' : 'Off'}`;
    });

    qrBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      qrModal.classList.remove('hidden');

      const activeUrl = window.location.href;

      if (!qrcodeInstance) {
        qrcodeDisplay.innerHTML = '';
        qrcodeInstance = new QRCode(qrcodeDisplay, {
          text: activeUrl,
          width: 180,
          height: 180,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    });

    const closeModals = (e) => {
      e?.stopPropagation();
      qrModal.classList.add('hidden');
    };

    closeQrBtn.addEventListener('click', closeModals);
    closeQrIconBtn.addEventListener('click', closeModals);
    qrModal.addEventListener('click', closeModals);
  </script>
</body>
</html>
